[package]
name = "droide-compiler"
version = "0.1.0"
edition = "2021"
description = "Droide compiler: forms to DEX, manifest, and a signed APK"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

[[bin]]
name = "droide"
path = "src/bin/droide.rs"
