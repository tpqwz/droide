name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        shell: bash
        run: |
          set -euo pipefail
          ver=$(tr -d '[:space:]' < VERSION)
          test -n "$ver"
          grep -q "^version = \"$ver\"$" compiler/Cargo.toml
          grep -q "^version = \"$ver\"$" studio/Cargo.toml
          grep -q "^__version__ = \"$ver\"$" droide/__init__.py
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF" != "refs/tags/v$ver" ]; then
            echo "tag $GITHUB_REF does not match VERSION $ver"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            compiler
            studio

      - name: Linux libraries for the studio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Compile
        run: |
          cargo build --release --locked --manifest-path compiler/Cargo.toml
          cargo build --release --locked --manifest-path studio/Cargo.toml

      - name: Pack the executables
        shell: bash
        run: |
          set -euo pipefail
          ver=$(tr -d '[:space:]' < VERSION)
          os=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          case "$arch" in
            x86_64|amd64) arch=x86_64 ;;
            aarch64|arm64) arch=aarch64 ;;
          esac
          mkdir -p pack
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp compiler/target/release/droide.exe pack/droide.exe
            cp studio/target/release/droide-studio.exe pack/droide-studio.exe
          else
            cp compiler/target/release/droide pack/droide
            cp studio/target/release/droide-studio pack/droide-studio
            chmod +x pack/droide pack/droide-studio
          fi
          name="droide-${ver}-${os}-${arch}.zip"
          py=$(command -v python3 || command -v python)
          "$py" .github/pack.py "$name"
          echo "archive=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive }}
          path: ${{ env.archive }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          printf -v notes '%s\n\n%s\n%s\n' \
            "Alpha release of Droide ${ver}." \
            "Each archive contains the compiler droide and the studio droide-studio." \
            "The studio is a desktop program. The compiler writes a signed APK and calls openssl on the machine where it runs."
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Droide $ver" \
            --prerelease \
            --notes "$notes"
