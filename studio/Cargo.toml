[package]
name = "droide-studio"
version = "0.1.0"
edition = "2021"
description = "Native cross-platform studio for Droide"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
